name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: skills-ref (validador do agentskills.io)
        run: pipx install skills-ref==0.1.1
      - name: validate
        run: node scripts/validate.mjs --skills-ref --no-extra
      - name: guard
        env:
          GUARD_DENY: ${{ secrets.GUARD_DENY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          # PR de fork não recebe secrets: roda só com os padrões genéricos.
          if [ "$IS_FORK" = "true" ]; then
            node scripts/guard.mjs --all
          else
            node scripts/guard.mjs --all --require-deny
          fi
